<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clarity-guild.live — maintenance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #21262d;
    --fg:      #e6edf3;
    --fg2:     #7d8590;
    --green:   #4ade80;
    --green2:  #166534;
    --green3:  #14532d;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    overflow: hidden;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3rem 3.5rem;
    max-width: 540px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green);
    border: 1px solid var(--green2);
    background: rgba(74, 222, 128, 0.06);
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
    margin-bottom: 0.5rem;
  }

  h1 span {
    color: var(--green);
  }

  .es {
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: var(--fg2);
    font-weight: 400;
    margin-bottom: 2.5rem;
    font-style: italic;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 2rem;
  }

  .note {
    font-size: 0.8rem;
    color: var(--fg2);
    line-height: 1.6;
  }

  /* grass strip */
  .grass {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    display: flex;
    align-items: flex-end;
    gap: 0;
    pointer-events: none;
    z-index: 0;
  }

  .blade {
    flex: 1;
    transform-origin: bottom center;
    animation: sway 3s ease-in-out infinite;
  }

  .blade::after {
    content: '';
    display: block;
    margin: 0 auto;
    border-radius: 999px 999px 2px 2px;
    background: var(--green3);
  }

  .blade:nth-child(odd)::after  { width: 4px; height: 28px; background: var(--green2); }
  .blade:nth-child(3n)::after   { width: 3px; height: 20px; }
  .blade:nth-child(5n)::after   { width: 5px; height: 36px; background: #15803d; }
  .blade:nth-child(7n)::after   { width: 3px; height: 16px; }
  .blade:nth-child(11n)::after  { width: 4px; height: 44px; background: #4ade80; opacity: 0.6; }

  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    30%       { transform: rotate(4deg); }
    70%       { transform: rotate(-3deg); }
  }

  .blade:nth-child(2n)  { animation-delay: -0.7s; }
  .blade:nth-child(3n)  { animation-delay: -1.4s; }
  .blade:nth-child(5n)  { animation-delay: -0.3s; }
  .blade:nth-child(7n)  { animation-delay: -2.1s; }
  .blade:nth-child(11n) { animation-delay: -1.0s; }

  @media (prefers-reduced-motion: reduce) {
    .blade { animation: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">maintenance</div>
  <h1>go touch <span>grass</span> pls</h1>
  <p class="es">ve a tocar hierba, pls</p>
  <div class="divider"></div>
  <p class="note">clarity-guild.live is briefly offline.<br>check back in a little while.</p>
</div>

<div class="grass" id="grass"></div>

<script>
  const g = document.getElementById('grass');
  const n = Math.floor(window.innerWidth / 6);
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'blade';
    g.appendChild(b);
  }
</script>

</body>
</html>
